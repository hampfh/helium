name: Test Deathstar

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: deathstar

    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4]

    steps:
      - name: Test concurrency
        run: |
          echo "Worker ${{ matrix.worker }}"
          echo "Runner: $RUNNER_NAME"
          docker version
          sleep 60
